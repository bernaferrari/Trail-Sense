# Every version is the latest stable release on Maven Central or Google Maven as of 2026-11-09.

[versions]
andromeda = "26.0.0"
# Targets
android-compileSdk = "37"
android-minSdk = "24"
jvmToolchain = "17"
# Build
kotlin = "2.4.21"
agp = "9.5.1"
composeMultiplatform = "1.12.2"
composeMaterial3 = "1.9.0"
mavenPublish = "0.37.0"
# Kotlin
atomicfu = "0.33.0"
coroutines = "1.11.0"
datetime = "0.8.0"
serialization = "1.12.0"
# AndroidX
androidx-activity = "1.13.0"
androidx-camera = "1.6.2"
androidx-core = "1.19.1"
androidx-documentfile = "1.1.0"
androidx-glance = "1.2.0"
androidx-lifecycle = "2.11.0"
androidx-print = "1.1.0"
androidx-test-junit = "1.3.0"
androidx-test-espresso = "3.7.0"
androidx-work = "2.12.0"
jetbrains-lifecycle = "2.11.0"
jetbrains-navigation = "2.10.0"
# Libraries
camerak = "1.2"
coil = "3.6.3"
filekit = "0.17.0"
gadulka = "1.14.0"
javacpp = "1.5.14"
jetbrains-markdown = "0.7.18"
kable = "0.45.0"
kitepdf = "0.13.0"
kiteqr = "0.1.0"
kmpnotifier = "2.0.2"
kmpZip = "2.1.0"
korlibs = "6.0.0"
ksensor = "9.40.0"
ktor = "3.6.1"
# LiteRT 2.x (2.3.2) removed the NNAPI delegate that ClassifierAcceleration.AndroidNnapi uses; 1.4.2 is the newest 1.x
litert = "1.4.2"
luna = "2.4.1"
markdownRenderer = "0.46.0"
moko-permissions = "0.20.1"
multiplatformSettings = "1.3.0"
okio = "3.18.2"
oshi = "7.7.3"
pdfbox = "3.0.8"
pulsar = "0.1.0"
qrcodeKotlin = "4.5.0"
sol = "19.4.0"
tensorflowLiteJvm = "2.21.0-1.5.14"
xmlutil = "1.0.2.1"
zoomimage = "1.7.0"
zxing = "3.5.4"
audioCapture = "0.1.0"
# Tests
junit4 = "4.13.2"
junit5 = "6.1.3"

[libraries]
# Gradle plugins used by build-logic
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
compose-gradlePlugin = { module = "org.jetbrains.compose:compose-gradle-plugin", version.ref = "composeMultiplatform" }
mavenPublish-gradlePlugin = { module = "com.vanniktech:gradle-maven-publish-plugin", version.ref = "mavenPublish" }

# Kotlin
kotlinx-atomicfu = { module = "org.jetbrains.kotlinx:atomicfu", version.ref = "atomicfu" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

# Compose Multiplatform
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "composeMaterial3" }
jetbrains-lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "jetbrains-lifecycle" }
jetbrains-navigation-compose = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "jetbrains-navigation" }

# AndroidX
androidx-activity = { module = "androidx.activity:activity", version.ref = "androidx-activity" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "androidx-camera" }
androidx-camera-compose = { module = "androidx.camera:camera-compose", version.ref = "androidx-camera" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "androidx-camera" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-documentfile = { module = "androidx.documentfile:documentfile", version.ref = "androidx-documentfile" }
androidx-glance-appwidget = { module = "androidx.glance:glance-appwidget", version.ref = "androidx-glance" }
androidx-lifecycle-livedata-core-ktx = { module = "androidx.lifecycle:lifecycle-livedata-core-ktx", version.ref = "androidx-lifecycle" }
androidx-print = { module = "androidx.print:print", version.ref = "androidx-print" }
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "androidx-work" }

# Libraries
audioCapture = { module = "io.github.piotrprus:audio-capture", version.ref = "audioCapture" }
camerak = { module = "io.github.kashif-mehmood-km:camerak", version.ref = "camerak" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-ktor3 = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "coil" }
filekit-core = { module = "io.github.vinceglb:filekit-core", version.ref = "filekit" }
